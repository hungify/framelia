name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @framelia/verify exec playwright install --with-deps chromium
      - run: pnpm validate

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @framelia/verify exec playwright install --with-deps chromium
      - name: Build release assets
        run: pnpm run build
      - name: Verify synchronized package versions
        id: release
        shell: bash
        run: |
          contracts_version=$(node -p "require('./packages/contracts/package.json').version")
          verify_version=$(node -p "require('./packages/verify/package.json').version")
          ui_server_version=$(node -p "require('./packages/ui-server/package.json').version")
          playwright_version=$(node -p "require('./packages/playwright/package.json').version")
          cli_version=$(node -p "require('./packages/cli/package.json').version")
          if [[ "$contracts_version" != "$verify_version" || "$verify_version" != "$ui_server_version" || "$ui_server_version" != "$playwright_version" || "$playwright_version" != "$cli_version" ]]; then
            echo "Package versions must match: contracts=$contracts_version verify=$verify_version ui-server=$ui_server_version playwright=$playwright_version cli=$cli_version" >&2
            exit 1
          fi
          echo "version=$cli_version" >> "$GITHUB_OUTPUT"
      - name: Pack release artifacts
        run: |
          mkdir -p .release/contracts .release/verify .release/ui-server .release/playwright .release/cli
          pnpm --filter @framelia/contracts pack --pack-destination "$GITHUB_WORKSPACE/.release/contracts"
          pnpm --filter @framelia/verify pack --pack-destination "$GITHUB_WORKSPACE/.release/verify"
          pnpm --filter @framelia/ui-server pack --pack-destination "$GITHUB_WORKSPACE/.release/ui-server"
          pnpm --filter @framelia/playwright pack --pack-destination "$GITHUB_WORKSPACE/.release/playwright"
          pnpm --filter framelia pack --pack-destination "$GITHUB_WORKSPACE/.release/cli"
      - name: Publish packages in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          publish_package() {
            package_dir="$1"
            package_name=$(node -p "require('./${package_dir}/package.json').name")
            package_version=$(node -p "require('./${package_dir}/package.json').version")
            if npm view "${package_name}@${package_version}" version --json >/dev/null 2>&1; then
              echo "Skipping existing ${package_name}@${package_version}"
              return
            fi
            pnpm --dir "$package_dir" publish --access public --no-git-checks
          }

          publish_package packages/contracts
          publish_package packages/verify
          publish_package packages/ui-server
          publish_package packages/playwright
          publish_package packages/cli
      - name: Verify packages from public registry
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          verify_public_package() {
            package_name="$1"
            package_spec="${package_name}@${RELEASE_VERSION}"

            for attempt in {1..20}; do
              published_version=$(npm view "$package_spec" version \
                --registry="https://registry.npmjs.org" \
                --prefer-online 2>/dev/null || true)
              if [[ "$published_version" == "$RELEASE_VERSION" ]]; then
                echo "Verified ${package_spec} from public registry"
                return
              fi

              if [[ "$attempt" -lt 20 ]]; then
                echo "Waiting for ${package_spec} to become public (${attempt}/20)"
                sleep 15
              fi
            done

            echo "Package ${package_spec} is not available from public registry" >&2
            return 1
          }

          verify_public_package @framelia/contracts
          verify_public_package @framelia/verify
          verify_public_package @framelia/ui-server
          verify_public_package @framelia/playwright
          verify_public_package framelia

          consumer_dir=$(mktemp -d)
          trap 'rm -rf "$consumer_dir"' EXIT
          npm exec --yes --prefer-online \
            --package="framelia@${RELEASE_VERSION}" -- \
            framelia status --project-root "$consumer_dir"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "GitHub Release v${RELEASE_VERSION} already exists"
          else
            gh release create "v${RELEASE_VERSION}" .release/cli/*.tgz \
              --target "$GITHUB_SHA" \
              --title "v${RELEASE_VERSION}" \
              --generate-notes
          fi
