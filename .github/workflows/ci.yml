name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @framelia/verify exec playwright install --with-deps chromium
      - run: pnpm validate

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build release assets from the clean checkout
        run: pnpm run build
      - name: Pack release artifacts
        shell: bash
        run: |
          for package in contracts verify dashboard-server playwright cli; do
            mkdir -p ".release/$package"
            pnpm --dir "packages/$package" pack --pack-destination "$GITHUB_WORKSPACE/.release/$package"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: .release
          include-hidden-files: true
          if-no-files-found: error

  consumer:
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24", "26"]
        package-manager: [npm, pnpm]
        playwright: ["1.61.1", "1.63.0"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: .release
      - name: Verify packed public entrypoints and real browser comparisons
        run: >-
          node scripts/consumer-smoke.mjs
          --pack-dir .release
          --package-manager ${{ matrix.package-manager }}
          --playwright-version ${{ matrix.playwright }}
          --install-browser

  publish:
    needs: [validate, consumer]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Verify synchronized package versions
        id: release
        shell: bash
        run: |
          contracts_version=$(node -p "require('./packages/contracts/package.json').version")
          verify_version=$(node -p "require('./packages/verify/package.json').version")
          dashboard_server_version=$(node -p "require('./packages/dashboard-server/package.json').version")
          playwright_version=$(node -p "require('./packages/playwright/package.json').version")
          cli_version=$(node -p "require('./packages/cli/package.json').version")
          if [[ "$contracts_version" != "$verify_version" || "$verify_version" != "$dashboard_server_version" || "$dashboard_server_version" != "$playwright_version" || "$playwright_version" != "$cli_version" ]]; then
            echo "Package versions must match: contracts=$contracts_version verify=$verify_version dashboard-server=$dashboard_server_version playwright=$playwright_version cli=$cli_version" >&2
            exit 1
          fi
          echo "version=$cli_version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: .release
      - name: Publish the verified tarballs in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          publish_package() {
            package_dir="$1"
            package_name=$(node -p "require('./${package_dir}/package.json').name")
            package_version=$(node -p "require('./${package_dir}/package.json').version")
            if npm view "${package_name}@${package_version}" version --json >/dev/null 2>&1; then
              echo "Skipping existing ${package_name}@${package_version}"
              return
            fi
            archive_dir=".release/${package_dir#packages/}"
            archives=("$archive_dir/"*.tgz)
            if [[ "${#archives[@]}" != 1 || ! -f "${archives[0]}" ]]; then
              echo "Expected one verified tarball in $archive_dir" >&2
              return 1
            fi
            npm publish "${archives[0]}" --access public
          }

          publish_package packages/contracts
          publish_package packages/verify
          publish_package packages/dashboard-server
          publish_package packages/playwright
          publish_package packages/cli
      - name: Verify packages from public registry
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          verify_public_package() {
            package_name="$1"
            package_spec="${package_name}@${RELEASE_VERSION}"

            for attempt in {1..20}; do
              published_version=$(npm view "$package_spec" version \
                --registry="https://registry.npmjs.org" \
                --prefer-online 2>/dev/null || true)
              if [[ "$published_version" == "$RELEASE_VERSION" ]]; then
                echo "Verified ${package_spec} from public registry"
                return
              fi

              if [[ "$attempt" -lt 20 ]]; then
                echo "Waiting for ${package_spec} to become public (${attempt}/20)"
                sleep 15
              fi
            done

            echo "Package ${package_spec} is not available from public registry" >&2
            return 1
          }

          verify_public_package @framelia/contracts
          verify_public_package @framelia/verify
          verify_public_package @framelia/dashboard-server
          verify_public_package @framelia/playwright
          verify_public_package framelia

          node scripts/consumer-smoke.mjs \
            --registry-version "$RELEASE_VERSION" \
            --package-manager npm \
            --playwright-version 1.61.1 \
            --collection-only
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "GitHub Release v${RELEASE_VERSION} already exists"
          else
            gh release create "v${RELEASE_VERSION}" .release/cli/*.tgz \
              --target "$GITHUB_SHA" \
              --title "v${RELEASE_VERSION}" \
              --generate-notes
          fi
