allowBuilds:
  esbuild: true

# https://pnpm.io/settings#minimumreleaseage
# https://pnpm.io/supply-chain-security#delay-dependency-updates
minimumReleaseAge: 1440

# Save exact versions to package.json instead of broad ranges
savePrefix: ""

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - '@framelia/contracts@0.0.1 || 0.0.2'
  - '@framelia/dashboard-server@0.0.1 || 0.0.2'
  - '@framelia/playwright@0.0.1 || 0.0.2'
  - '@framelia/verify@0.0.1 || 0.0.2'
  - framelia@0.0.1 || 0.0.2
